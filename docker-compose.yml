version: '3.8'

services:
  backend:
    build:
      context: ./BE
    container_name: luvia_backend
    restart: always
    environment:
      - PORT=3000
      - MONGO_URI=${MONGO_URI:-mongodb+srv://Luvia:Luvia@luvia.ovii8ij.mongodb.net/?appName=Luvia}
      - JWT_SECRET=${JWT_SECRET:-mysecretkey123}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - luvia_network

  frontend:
    build:
      context: ./FE
      args:
        - VITE_API_BASE_URL=/api
        - VITE_UPLOADS_BASE_URL=/uploads
    container_name: luvia_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - luvia_network

networks:
  luvia_network:
    driver: bridge
